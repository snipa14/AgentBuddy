services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    container_name: foundry-docker-socket-proxy
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      POST: 1
      BUILD: 0
      NETWORKS: 0
      VOLUMES: 0
      SWARM: 0
      SYSTEM: 0
      SERVICES: 0
      TASKS: 0
      CONFIGS: 0
      SECRETS: 0
      PLUGINS: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - foundry_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  executor:
    build:
      context: .
      dockerfile: services/executor/Dockerfile
    image: foundry/executor:latest
    container_name: foundry-executor
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Absolute *host* path of ./projects -- see services/executor/SECURITY.md
      # ("The Docker-outside-of-Docker (DooD) detail") for why this can't be
      # derived from the container's own filesystem.
      PROJECTS_HOST_PATH: ${PROJECTS_HOST_PATH:?set PROJECTS_HOST_PATH to the absolute host path of ./projects, see .env.example}
      STACKS_CONFIG_PATH: /app/config/stacks.yaml
      # Set explicitly, in the same file as the `foundry_workspace` network
      # declaration below, rather than left to match
      # services/executor/config.py's DEFAULT_NETWORK_NAME/DEFAULT_WORKSPACE_IMAGE
      # by coincidence -- this network's own comment already describes one
      # prior incident from a name mismatch.
      WORKSPACE_NETWORK: foundry_workspace
      WORKSPACE_IMAGE: foundry/workspace-python:3.12
    volumes:
      - ./config:/app/config:ro
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - foundry_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: foundry/orchestrator:latest
    container_name: foundry-orchestrator
    environment:
      OLLAMA_ENABLED: "false"
      EXECUTOR_URL: http://executor:8000
      MEMORY_DB_PATH: /data/memory/foundry_memory.db
      PROJECTS_ROOT: /data/projects
      MODELS_CONFIG_PATH: /app/config/models.yaml
      STACKS_CONFIG_PATH: /app/config/stacks.yaml
      PLUGINS_DIR: /app/plugins
    secrets:
      - claude_api_key
      - github_token
    volumes:
      - ./projects:/data/projects
      - ./config:/app/config:ro
      - ./plugins:/app/plugins:ro
      - foundry_memory:/data/memory
    depends_on:
      executor:
        condition: service_healthy
    networks:
      - foundry_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  telegram-gateway:
    build:
      context: .
      dockerfile: services/telegram_gateway/Dockerfile
    image: foundry/telegram-gateway:latest
    container_name: foundry-telegram-gateway
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      # Optional overrides for the progress poller (services/telegram_gateway/
      # progress_poller.py); defaults to POLL_INTERVAL_SECONDS=3.0,
      # MAX_IDLE_POLLS=100 when unset.
      # PROGRESS_POLL_INTERVAL_SECONDS: "3.0"
      # PROGRESS_POLL_MAX_IDLE_POLLS: "100"
    secrets:
      - telegram_bot_token
      - telegram_allowed_user_id
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - foundry_internal
    restart: unless-stopped

networks:
  foundry_internal:
    driver: bridge
    name: foundry_internal
  # Not attached to any service below -- ephemeral workspace containers are
  # spawned dynamically by the Executor (ARCHITECTURE.md §6/§7), not declared
  # here. docker-socket-proxy's NETWORKS=0 means the Executor itself can
  # never create or modify a network at runtime, only reference this one by
  # name. Isolated from foundry_internal: a workspace container can't reach
  # the proxy, the Orchestrator, or the Telegram Gateway.
  foundry_workspace:
    # external: true + scripts/start.sh creating it beforehand, not Compose:
    # a network declared here but referenced by no service below is *not*
    # reliably created by `docker compose up` on its own (confirmed live --
    # `docker network ls` showed no foundry_workspace at all after `up`,
    # even with the name pinned below), so relying on Compose for it left
    # every workspace container able to create() but never start() ("network
    # foundry_workspace not found"). external: true makes that failure mode
    # loud and immediate (`docker compose up` errors if it's missing) instead
    # of silent until the first container start.
    name: foundry_workspace
    external: true

volumes:
  foundry_memory:

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  telegram_allowed_user_id:
    file: ./secrets/telegram_allowed_user_id
  claude_api_key:
    file: ./secrets/claude_api_key
  github_token:
    file: ./secrets/github_token
