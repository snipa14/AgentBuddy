services:
  ollama:
    image: ollama/ollama:latest
    container_name: foundry-ollama
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - foundry_internal
    restart: unless-stopped

  orchestrator:
    environment:
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - executor
      - ollama

volumes:
  ollama_models:
