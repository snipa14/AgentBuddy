services:
  ollama:
    image: ollama/ollama:latest
    container_name: foundry-ollama
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - foundry_internal
    restart: unless-stopped

  orchestrator:
    environment:
      # OLLAMA_ENABLED is the only wiring the router reads (ModelRouter picks
      # it up at startup, ADR-015) -- an "ollama"-type provider's base_url is
      # a config/models.yaml field, e.g. http://ollama:11434 for this
      # service, not an env var read at request time.
      OLLAMA_ENABLED: "true"
    depends_on:
      - executor
      - ollama

volumes:
  ollama_models:
