[project]
name = "foundry"
version = "0.1.0"
description = "Self-hosted multi-agent software development platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "docker>=7.1",
    "aiogram>=3.15",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pygithub>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["services"]
pythonpath = ["."]
markers = [
    "integration: exercises real I/O -- Docker, filesystem, or network (see .claude/rules/testing.md)",
]

[tool.coverage.run]
branch = true
source = ["services"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
