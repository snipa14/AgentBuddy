[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry"
version = "0.1.0"
description = "Self-hosted multi-agent software development platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "docker>=7.1",
    "aiogram>=3.15",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pygithub>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# This repo is a flat layout whose root holds non-package directories
# (config/, secrets/, images/, plugins/, docs/, scripts/, projects/).
# setuptools' automatic discovery refuses a flat layout with more than one
# candidate top-level package and aborts the build, so the two real package
# trees are named explicitly -- this also keeps secrets/ and config/ out of
# any built artifact, which auto-discovery would otherwise have swept in.
[tool.setuptools.packages.find]
include = ["services*", "skills*"]

[tool.ruff]
target-version = "py312"
line-length = 100
# ruff's formatter reformats fenced ```python blocks inside Markdown files
# too -- fine for a README snippet, but docs/**/*.md's historical plan docs
# use indented code fences deliberately (e.g. "paste this method into class
# X"), and losing that indentation changes what the snippet means. Markdown
# is documentation prose, not lint-checked source; exclude it outright.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# sys.path.insert must precede the services.* imports it enables -- this
# operator CLI runs standalone (`python3 scripts/gen_workspace_images.py`),
# not via `python -m`, so it has no package context otherwise.
"scripts/gen_workspace_images.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["services", "skills"]
pythonpath = ["."]
markers = [
    "integration: exercises real I/O -- Docker, filesystem, or network (see .claude/rules/testing.md)",
]

[tool.coverage.run]
branch = true
source = ["services", "skills"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
